services:
  learning-app:
    build:
      context: ./src
      dockerfile: Dockerfile
    image: learning-app:0.1.0
    container_name: learning-app
    restart: unless-stopped
    user: '1001:1001'
    environment:
      TZ: Europe/Zurich
      NUXT_DB_PATH: /data/learning.db
      NUXT_MIGRATIONS_DIR: /app/migrations
    volumes:
      - ./data:/data
    networks: [proxy]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.learning-app.rule=Host(`learning.braendle.tech`)'
      - 'traefik.http.routers.learning-app.entrypoints=websecure'
      - 'traefik.http.routers.learning-app.tls.certresolver=letsencrypt'
      - 'traefik.http.services.learning-app.loadbalancer.server.port=3000'
      - 'traefik.http.routers.learning-app.middlewares=authelia@docker'

networks:
  proxy:
    external: true
